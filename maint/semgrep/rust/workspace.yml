rules:
  - id: attr-allow-discouraged
    message: "allow attributes are discouraged except for dead_code, unused_imports and unused_macros"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    pattern-regex: |-
      (?xm)
      ^[ \t]*                   # line start, optional indent
      \#!?\[allow\(             # outer #[allow( or inner #![allow(
      (?: " [^"]* " | [^")] )*? # any argument, stepping over reason text
      \b (?!                    # ... that names neither the reason keyword
        (?: reason | dead_code | unused_imports | unused_macros ) \b
      ) [a-z]                   # ... nor a permitted lint

  - id: attr-inner-roots-only
    message: "inner attributes (#![...]) are only permitted in crate/module roots"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs]
      exclude:
        - "**/lib.rs"
        - "**/main.rs"
        - "**/mod.rs"
        - "**/build.rs"
        - /meta/**/tests/**
        - /pkgs/**/tests/**
        - /meta/**/bench/**
        - /pkgs/**/bench/**
    pattern-regex: '(?m)^\s*#!\['

  - id: attr-once-per-file
    message: "one allow/expect attribute is permitted per file"
    severity: ERROR
    languages: [generic]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
      exclude: ["**/lib.rs", "**/main.rs", "**/mod.rs"]
    options:
      generic_multiline: true
    pattern-regex: |-
      (?xm)
      ^[ \t]* \#!?\[ (?: allow | expect ) \(  # a first attribute opens
      [^\]]* \]                               # ... through its closing ]
      [\s\S]*?                                # then, lazily, up to
      ^[ \t]* \#!?\[ (?: allow | expect ) \(  # a second such attribute

  - id: attr-requires-reason
    message: 'allow/expect attributes must carry a reason = "..."'
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    patterns:
      - pattern-regex: |-
          (?xm)
          ^[ \t]*                       # line start, optional indent
          \#!?\[ (?: allow | expect )   # #[allow / #[expect (or inner #![)
          \( [^)]* \) \]                # (...) through the closing )]
      - pattern-not-regex: 'reason\s*='

  - id: codec-no-raw-extend
    message: "use .encode() instead of extend_from_slice for codec buffers"
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - /pkgs/primitives/src/**/*.rs
        - /pkgs/p2p_core/src/**/*.rs
        - /pkgs/pkc/src/**/*.rs
        - /pkgs/script/src/**/*.rs
    patterns:
      - pattern-regex: '\.extend_from_slice\([^)]*\)'
      - pattern-not-regex: "to_be_bytes"
      - pattern-not-regex: '\.as_bytes\(\)'
      - pattern-not-regex: '&self\.0'
      - pattern-not-regex: "encode_to_vec"

  - id: derive-serde-disambiguate
    message: "use ::serde:: instead of serde:: in derive attributes"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    pattern-regex: 'derive\([^)]*(?<!:)serde::'

  - id: enum-bare-unknown
    message: "Unknown variant must carry the raw value"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    pattern-regex: '(?m)^\s+Unknown\s*[,}=]'

  - id: impl-no-into
    message: "implement From instead of Into; the blanket impl provides Into automatically"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    pattern-regex: '\bimpl\b[^{]*\bInto\s*<.*>\s+for\b'

  - id: macro-export-no-serde-cfg
    message: "use `$crate::cfg_serde!` and `$crate::__private::serde` to root dependency and cfg flag to defining macro."
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - /meta/**/*.rs
        - /pkgs/**/*.rs
      exclude:
        - /pkgs/types/marker/**
    pattern-regex: |-
      (?sxm)
      ^([ \t]*) \#\[macro_export\]
      (?: \n\1 \#\[[^\]]*\] )*
      \n\1 macro_rules!\s*\w+\s*\{
      (?: (?!^\1\}) . )*?
      (?: feature \s*=\s* "serde" | (?<![\w$:]) ::?serde:: )

  - id: macro-no-bare-foreign-crate
    message: >
      rooted foreign-crate paths (::crate::) in macros must route
      through $crate::__private for hygiene
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - /meta/**/*.rs
        - /pkgs/**/*.rs
      exclude:
        - /pkgs/types/marker/**
    patterns:
      - pattern-regex: '(?<![:\w])::[a-z_0-9]+::'
      - pattern-not-regex: "::(?:core|alloc|std|serde)::"
      - pattern-not-regex: '\$crate::__private::'

  - id: macro-no-bare-std-path
    message: "root std-prefix paths (::core::, ::alloc::, ::std::) in macros"
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - /meta/**/*.rs
        - /pkgs/**/*.rs
      exclude:
        - /pkgs/types/marker/**
    pattern-regex: |-
      (?sxm)
      ^([ \t]*) macro_rules!\s*\w+\s*\{
      (?: (?!^\1\}) . )*?
      (?<![:\w$]) (?:core|alloc|std)::

  - id: prelude-no-use-alloc
    message: "use crate::prelude instead of alloc:: directly"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs]
      exclude:
        - /meta/**/prelude.rs
        - /pkgs/**/prelude.rs
        - /meta/**/prelude/mod.rs
        - /pkgs/**/prelude/mod.rs
        - /docs/samples/**
    pattern-regex: '\buse\s+(::)?alloc(::|\s)'

  - id: prelude-use-wildcards-only
    message: "use crate::prelude::* instead of named imports from prelude"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs]
      exclude:
        - /meta/**/prelude.rs
        - /pkgs/**/prelude.rs
        - /meta/**/prelude/mod.rs
        - /pkgs/**/prelude/mod.rs
        - /docs/samples/**
    pattern-regex: '\buse\s+crate::prelude::[^*]'

  - id: style-no-from-raw
    message: "byte constructors are named from_bytes, not from_raw"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    patterns:
      - pattern-either:
          - pattern: |
              fn $FN(...) { ... }
          - pattern: |
              fn $FN(...) -> $RET { ... }
      - metavariable-regex:
          metavariable: $FN
          regex: "^from_raw$"

  - id: style-no-get-prefix
    message: "getters omit the get_ prefix"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
      exclude: [/meta/**/tests/**, /meta/**/bench/**, /pkgs/**/tests/**, /pkgs/**/bench/**]
    patterns:
      - pattern-either:
          - pattern: |
              fn $FN(&self, ...) { ... }
          - pattern: |
              fn $FN(&self) { ... }
          - pattern: |
              fn $FN(&mut self, ...) { ... }
          - pattern: |
              fn $FN(&mut self) { ... }
          - pattern: |
              fn $FN(&self, ...) -> $RET { ... }
          - pattern: |
              fn $FN(&self) -> $RET { ... }
          - pattern: |
              fn $FN(&mut self, ...) -> $RET { ... }
          - pattern: |
              fn $FN(&mut self) -> $RET { ... }
      - metavariable-regex:
          metavariable: $FN
          regex: "get_[a-z].*"

  - id: style-no-separator-comments
    message: "decorative separator comments are not permitted"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    pattern-regex: '^\s*//[/!]?\s*[-=]{4,}|^\s*//\s+--\s'

  - id: style-latin1-source
    message: "source files must contain only Latin-1 characters"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
    pattern-regex: '[^\x00-\xFF]'

  - id: typeid-no-manual-impl
    message: "use #[derive(TypeId)]; hand-written impls bypass the collision scanner"
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - /meta/**/*.rs
        - /pkgs/**/*.rs
        - /docs/samples/**/*.rs
        - /fuzz/**/*.rs
      exclude:
        - /pkgs/types/marker/**
    pattern-regex: '\bconst[ \t]+TYPE_ID[ \t]*:[^;]*='

  - id: use-pub-roots-only
    message: "pub use re-exports belong in lib.rs or mod.rs, not in leaf modules"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
      exclude: ["**/lib.rs", "**/mod.rs"]
    pattern-regex: '^\s*pub\s+use\s'

  - id: bytes-rev-means-hash
    message: "dash_types::make_bytes! is not suitable for hash types, use dash_num::make_hash! instead"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/meta/**/*.rs, /pkgs/**/*.rs, /docs/samples/**/*.rs, /fuzz/**/*.rs]
      exclude:
        - /pkgs/types/src/entity.rs # declares the generator
        - /pkgs/types/src/secret.rs # declares its secret sibling
    pattern-regex: |-
      (?x)
      \b (?: make | derive ) _ s? bytes !  # a byte-bag generator invocation
      \s* [({]                             # ... opening its arguments
      (?: [^\n]* \n ){0,6}?                # ... over its doc comment, if any
      [^\n]* \b rev \b                     # ... to the order token's line
