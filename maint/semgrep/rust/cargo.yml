rules:
  - id: cargo-serde-json-restrict
    message: "serde-json{,5} dependency unexpected outside dash-dev crate"
    severity: ERROR
    languages: [generic]
    paths:
      include: [/meta/**/Cargo.toml, /pkgs/**/Cargo.toml]
      exclude: [/meta/dev/Cargo.toml]
    pattern-regex: \b(serde[-_]json|json5)\b
