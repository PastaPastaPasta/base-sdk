# Secret handling policy
extensions:
  # Dependency types that are `Copy`, leaving the original behind on move.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: allowCopyableTypes
    data:
      - ["blst::blst_fr"]
      - ["secp256k1::Scalar"]
      - ["secp256k1::SecretKey"]

  # Non-`zeroize` methods that erase a value.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: allowEraseMethods
    data:
      - ["secp256k1::SecretKey::non_secure_erase"]
      - ["secp256k1::Scalar::non_secure_erase"]

  # Dependency types that erase themselves on drop.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: erasingTypes
    data:
      # `aes` implements `ZeroizeOnDrop` for its key schedules.
      - ["aes::Aes128"]
      - ["aes::Aes192"]
      - ["aes::Aes256"]
      # Declared `#[zeroize(drop)]`.
      - ["blst::min_pk::SecretKey"]

  # Known violations
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: ignoreLeak
    data: []
      # | crate     | module/struct   | method        |
      # | --------- | --------------- | ------------- |

  # Variables audited by hand to stage a secret safely.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: ignoreSinks
    data:
      # | crate     | module/struct   | method        | local variable |
      # | --------- | --------------- | ------------- | -------------- |
      # Holds the IV, then each ciphertext block. Both are public.
      - ["dash-pkc", "aes_cbc",        "encrypt",  "chain"]
      # Each recipient's ciphertext, public once made; it leaves in the container.
      - ["dash-pkc", "BlsIesMultiBlobs", "encrypt_with", "ciphertext"]
      # libsecp's `from_secret_bytes` takes the array by value. The key is erased after use.
      - ["dash-pkc", "EcdsaSecretKey", "generate", "bytes"]
      # base58ck's inline buffer, erased in place once the WIF is copied out.
      - ["dash-pkc", "EcdsaSkBytes",   "to_wif",   "wif"]

  # Types not considered secret-holding or likely to carry public data.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: ignoreTypes
    data:
      # `blst` points and pairing results, which are public.
      - ["blst::blst_fp12"]
      - ["blst::blst_p1_affine"]
      - ["blst::blst_p1"]
      - ["blst::blst_p2_affine"]
      - ["blst::blst_p2"]
      # Field element. It carries public ids and tweaks as often as secrets.
      - ["dash_pkc::bls::scalar::Fr"]
      # Public keys, signatures, messages and digests.
      - ["bitcoin_hashes::ripemd160::Hash"]
      - ["bitcoin_hashes::sha256::Hash"]
      - ["bitcoin_hashes::sha256d::Hash"]
      - ["bitcoin_hashes::sha3_256::Hash"]
      - ["blst::min_pk::PublicKey"]
      - ["blst::min_pk::Signature"]
      - ["ed25519_dalek::Signature"]
      - ["ed25519_dalek::VerifyingKey"]
      - ["secp256k1::ecdsa::RecoverableSignature"]
      - ["secp256k1::ecdsa::RecoveryId"]
      - ["secp256k1::ecdsa::Signature"]
      - ["secp256k1::Message"]
      - ["secp256k1::PublicKey"]
      - ["secp256k1::XOnlyPublicKey"]

  # Variables and parameters that carry a secret.
  - addsTo:
      pack: base-sdk/codeql-rust
      extensible: secretVariables
    data:
      - ["tweak"]
