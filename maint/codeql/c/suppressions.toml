# CodeQL's front end does not know clang's `__builtin_available`, so it reads
# the builtin as an implicitly declared function.
[[finding]]
path = "contrib/probes/hello.c"
message = "Reserved identifier '__builtin_available' is declared."

[[finding]]
path = "contrib/probes/hello.c"
message = "Function call implicitly declares '__builtin_available'."

# The probe names the POSIX level it needs for `getline` and `strtok_r`, as
# feature-test macros are declared.
[[finding]]
path = "contrib/vectors/bls_oracle/probe.c"
message = "Reserved identifier '_POSIX_C_SOURCE' is declared."
