[project]
name = "dash-base-sdk"
version = "0.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["dash-base-sdk[tools,lib]"]
lib = [
  "lief>=1.0",
  "Markdown>=3.7",
  "pygments-styles>=0.3.0",
  "pymarkdownlnt>=0.9.37",
  "pytest>=8",
  "rjsmin>=1.2",
]
tools = [
  "ruff>=0.9",
  "semgrep>=1.118.0",
  "taplo>=0.9.3; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "zensical>=0.0.33",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "preprocess.py"]
testpaths = ["docs"]

[tool.setuptools]
packages = []

[tool.ruff]
indent-width = 2
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff
  "S",   # flake8-bandit
  "TCH", # flake8-type-checking
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Suppression due to pytest module.
"docs/preprocess.py" = ["S101"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pymarkdown.extensions.markdown-tables]
enabled = true

[tool.pymarkdown.plugins.md013]
line_length = 120
heading_line_length = 120
code_blocks = false
tables = false

# Changelogs repeat `### Added` and the like under every release.
[tool.pymarkdown.plugins.md024]
siblings_only = true
