name: Cross-compilation build

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Initialize devshell
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check cache write access
        id: cache_write
        uses: ./.github/actions/cache_write

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix
        id: niks3
        uses: Mic92/niks3-action@v1
        if: vars.CACHE_NIX_URL != ''
        with:
          server-url: ${{ vars.CACHE_NIX_URL }}
          skip-push: ${{ steps.cache_write.outputs.allowed != 'true' }}

      - name: Upload devshell
        if: steps.cache_write.outputs.allowed == 'true' && vars.CACHE_NIX_URL != ''
        shell: bash
        env:
          NIKS3: ${{ steps.niks3.outputs.binary-dir }}/niks3
          NIKS3_SERVER_URL: ${{ vars.CACHE_NIX_URL }}
          NIKS3_TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          nix develop ./contrib/nix#dev --profile "${RUNNER_TEMP}/devshell" --command true
          "${NIKS3}" push --server-url "${NIKS3_SERVER_URL}" --auth-token-script "${NIKS3_TOKEN_SCRIPT}" \
            "$(readlink -f "${RUNNER_TEMP}/devshell")"

      - name: Initialize devshell
        run: nix develop ./contrib/nix#dev --command true

      - name: Manage Bazel downloads
        uses: actions/cache@v5
        with:
          path: |
            .cache/bazel/cache/repos
            .cache/bazelisk
          key: bazel-probes-repos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'bazel/*.MODULE.bazel') }}
          restore-keys: |
            bazel-probes-repos-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate toolchains
        run: nix develop ./contrib/nix#dev --command ./contrib/smoke_test.py

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    needs: shell
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - aarch64-apple-darwin

    defaults:
      run:
        shell: nix develop ./contrib/nix#dev --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check cache write access
        id: cache_write
        uses: ./.github/actions/cache_write

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix
        uses: Mic92/niks3-action@v1
        if: vars.CACHE_NIX_URL != ''
        with:
          server-url: ${{ vars.CACHE_NIX_URL }}
          skip-push: ${{ steps.cache_write.outputs.allowed != 'true' }}

      - name: Restore cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-build-cross-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            cargo-build-cross-${{ matrix.target }}-

      - name: Build workspace
        run: cargo build --workspace --all-targets --features full --target ${{ matrix.target }}
