name: "dash-pkc"

on:
  workflow_dispatch:
  push:
    paths: &paths
      - .cargo/nextest.toml
      - .github/workflows/build_msrv.yml
      - .github/workflows/pkg_pkc.yml
      - Cargo.lock
      - Cargo.toml
      - contrib/nix/**
      - pkgs/num/**
      - pkgs/pkc/**
      - pkgs/types/**
      - pyproject.toml
      - rust-toolchain.toml
      - uv.lock
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    uses: ./.github/workflows/build_msrv.yml
    with:
      package: dash-pkc
      package_dir: pkc
    secrets: inherit
