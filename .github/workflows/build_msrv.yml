name: MSRV (1.89)

on:
  workflow_call:
    inputs:
      package:
        description: Cargo package name (e.g. dash-num)
        required: true
        type: string
      package_dir:
        description: Package directory relative to pkgs/ (e.g. num)
        required: true
        type: string
      fuzz_package_dir:
        description: Fuzz package directory relative to fuzz/ (e.g. pow)
        required: false
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true' || steps.filter.outputs.msrv == 'true' || steps.filter.outputs[inputs.package_dir] == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/paths.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yml

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      HAS_CODECOV: ${{ secrets.CODECOV_TOKEN != '' }}

    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: ${{ inputs.fuzz_package_dir != '' }}

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://dashpay-base-sdk.cachix.org
            extra-trusted-public-keys = dashpay-base-sdk.cachix.org-1:TAoDyYL2e60lUEG8n10gvIZmujM5rJAhaG613fNfOWI=

      - name: Cache Nix
        uses: cachix/cachix-action@v17
        with:
          name: dashpay-base-sdk
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipAddingSubstituter: true

      - name: Restore cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: |
            target
            !target/nextest
            fuzz/target
          key: cargo-build-msrv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package }}-${{ github.sha }}
          restore-keys: |
            cargo-build-msrv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package }}-

      - name: Select the MSRV toolchain
        run: |
          {
            echo "RUSTC=$TOOLCHAIN_MSRV/bin/rustc"
            echo "RUSTDOC=$TOOLCHAIN_MSRV/bin/rustdoc"
            echo "CARGO=$TOOLCHAIN_MSRV/bin/cargo"
          } >> "$GITHUB_ENV"

      - name: Build every feature
        run: '"$CARGO" hack -p ${{ inputs.package }} --exclude-features default --each-feature build'

      - name: Test every feature
        run: |
          "$CARGO" hack -p ${{ inputs.package }} --exclude-features default --each-feature nextest run --config-file .cargo/nextest.toml --no-tests=warn
          "$CARGO" hack -p ${{ inputs.package }} --exclude-features default --each-feature test --doc

      - name: Test package (with coverage)
        run: |
          "$CARGO" llvm-cov clean --workspace
          "$CARGO" llvm-cov --no-report nextest --config-file .cargo/nextest.toml --package ${{ inputs.package }} --features full --no-tests=warn
          "$CARGO" llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: env.HAS_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ inputs.package }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV == 'true' && hashFiles('target/nextest/default/junit.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: target/nextest/default/junit.xml
          report_type: test_results
          flags: ${{ inputs.package }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Replay fuzz corpora
        if: inputs.fuzz_package_dir != ''
        run: PATH="$TOOLCHAIN_MSRV/bin:$PATH" just fuzz::test

      - name: Sanity check benchmarks
        run: '"$CARGO" hack -p ${{ inputs.package }} --exclude-features default --each-feature test --benches'
