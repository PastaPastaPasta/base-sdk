# Fork-only (DEC-762): deletes the `cargo-build-*` caches the upstream build
# workflows save on this fork. Those caches hold `target/` from jobs that grant
# `id-token: write`, and libz-sys < 1.1.31 (RUSTSEC-2026-0418) writes the build
# environment, that job's OIDC request token included, into `target/`. The
# upstream workflows run from each pushed branch's own copy, so this fork cannot
# change them; this file sits on `fork-ci`, the default branch, so
# `workflow_run` fires for every one of their runs, pushed through the dispatch
# helper or not. It reads no input from the run that triggered it.
# Remove this file, with fork-ci.yml's RUSTSEC-2026-0418 step, once upstream
# develop's Cargo.lock has libz-sys >= 1.1.31; until then it says so itself.
name: cargo-build-cache-janitor
run-name: "cargo-build-cache-janitor after ${{ github.event.workflow_run.name || 'a manual sweep' }}"

on:
  workflow_run:
    workflows:
      - dash-num
      - dash-p2p-core
      - dash-params
      - dash-pkc
      - dash-pow
      - dash-primitives
      - dash-script
      - dash-types
      - Build on stable
      - Cross-compilation build
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cargo-build-cache-janitor
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep cargo-build caches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write

    steps:
      - name: Delete cargo-build-* caches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          lock=$(curl -fsSL --retry 3 https://raw.githubusercontent.com/dashpay/base-sdk/develop/Cargo.lock || true)
          lowest=$(awk '$0 == "name = \"libz-sys\"" { getline; gsub(/"/, "", $3); print $3 }' <<<"${lock}" | sort -V | head -1)
          if [ -z "${lock}" ]; then
            echo "::warning::could not read upstream develop's Cargo.lock; sweeping anyway"
          elif [ -z "${lowest}" ] || [ "$(printf '%s\n' "${lowest}" 1.1.31 | sort -V | head -1)" = 1.1.31 ]; then
            echo "::notice::upstream develop has libz-sys ${lowest:-nowhere}, so these caches are safe again: remove this workflow and fork-ci.yml's RUSTSEC-2026-0418 step"
            exit 0
          fi
          gh cache list -R "${GITHUB_REPOSITORY}" --key cargo-build- -L 1000 --json id,key,ref \
            --jq '.[] | select(.key | startswith("cargo-build-")) | [.id, .ref, .key] | @tsv' > "${RUNNER_TEMP}/caches.tsv"
          found=$(grep -c . "${RUNNER_TEMP}/caches.tsv" || true)
          deleted=0
          failed=0
          while IFS=$'\t' read -r id ref key; do
            if [ "${DRY_RUN}" = true ]; then
              echo "would delete ${key} (${ref})"
            elif gh cache delete "${id}" -R "${GITHUB_REPOSITORY}" > /dev/null; then
              echo "deleted ${key} (${ref})"
              deleted=$((deleted + 1))
            else
              # Another sweep may have taken it first.
              echo "::warning::could not delete ${key} (${ref})"
              failed=$((failed + 1))
            fi
          done < "${RUNNER_TEMP}/caches.tsv"
          line="cargo-build caches: found ${found}, deleted ${deleted}, failed ${failed}, dry_run ${DRY_RUN} (upstream develop libz-sys ${lowest:-unknown})"
          echo "${line}"
          echo "${line}" >> "${GITHUB_STEP_SUMMARY}"
