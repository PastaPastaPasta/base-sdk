name: "dash-p2p-core"

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  msrv:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: $/.github/workflows/build_msrv.yml
    with:
      package: dash-p2p-core
      package_dir: p2p_core
    secrets: inherit
