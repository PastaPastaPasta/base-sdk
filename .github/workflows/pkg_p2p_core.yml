name: "dash-p2p-core"

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  msrv:
    uses: ./.github/workflows/build_msrv.yml
    with:
      package: dash-p2p-core
      package_dir: p2p_core
    secrets: inherit

  bazel:
    uses: ./.github/workflows/build_bazel.yml
    with:
      package_dir: p2p_core
