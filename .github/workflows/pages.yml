name: Deploy docs

on:
  push:
    branches: [develop]
  pull_request:
    paths:
      - pkgs/**
      - docs/**
      - .github/workflows/pages.yml
      - pyproject.toml
      - uv.lock
      - contrib/nix/**
      - rust-toolchain.toml
      - README.md
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check cache write access
        id: cache_write
        uses: $/.github/actions/cache_write

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix
        uses: Mic92/niks3-action@v1
        if: vars.CACHE_NIX_URL != ''
        with:
          server-url: ${{ vars.CACHE_NIX_URL }}
          skip-push: ${{ steps.cache_write.outputs.allowed != 'true' }}

      - name: Test documentation tooling
        run: pytest

      - name: Restore cargo registry
        uses: $/.github/actions/gha_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-
          restore-only: "true"
          url: ${{ vars.CACHE_GHA_URL }}
          bucket: ${{ vars.CACHE_GHA_BUCKET }}
          region: ${{ vars.CACHE_GHA_REGION }}
          key-id: ${{ vars.CACHE_GHA_KEY_ID }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_GHA_AUTH || '' }}

      - name: Build documentation
        run: python3 docs/build_docs.py build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-24.04-arm

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
