name: "dash-types"

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  msrv:
    uses: ./.github/workflows/build_msrv.yml
    with:
      package: dash-types
      package_dir: types
    secrets: inherit

  bazel:
    uses: ./.github/workflows/build_bazel.yml
    with:
      package_dir: types
