name: Lint and build on nightly

on:
  workflow_call:
    inputs:
      package:
        description: Cargo package name (e.g. dash-num)
        required: true
        type: string
      package_dir:
        description: Package directory relative to pkgs/ (e.g. num)
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  nightly:
    name: ubuntu-24.04-arm (nightly, ${{ matrix.config.name }})
    runs-on: ubuntu-24.04-arm
    env:
      HAS_CODECOV: ${{ secrets.CODECOV_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: full, args: "--features full" }
          - { name: min, args: "--no-default-features" }
          - { name: std, args: "--features std" }

    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://dashpay-base-sdk.cachix.org
            extra-trusted-public-keys = dashpay-base-sdk.cachix.org-1:TAoDyYL2e60lUEG8n10gvIZmujM5rJAhaG613fNfOWI=

      - name: Cache Nix
        uses: cachix/cachix-action@v17
        with:
          name: dashpay-base-sdk
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipAddingSubstituter: true

      - name: Manage cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: |
            target
            !target/nextest
          key: cargo-build-nightly-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package }}-${{ matrix.config.name }}-${{ github.sha }}
          restore-keys: |
            cargo-build-nightly-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package }}-${{ matrix.config.name }}-

      - name: Lint package
        run: cargo clippy -p ${{ inputs.package }} ${{ matrix.config.args }} --tests --benches -- -D warnings

      - name: Build package
        run: cargo build -p ${{ inputs.package }} ${{ matrix.config.args }}

      - name: Test package
        if: matrix.config.name != 'full'
        run: |
          cargo nextest run --config-file .cargo/nextest.toml -p ${{ inputs.package }} ${{ matrix.config.args }}
          cargo test --doc -p ${{ inputs.package }} ${{ matrix.config.args }}

      - name: Check formatting
        if: matrix.config.name == 'full'
        run: python3 maint/lint/lint_rust.py

      - name: Test package (with coverage)
        if: matrix.config.name == 'full'
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report nextest --config-file .cargo/nextest.toml ${{ matrix.config.args }} --package ${{ inputs.package }}
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo test --doc -p ${{ inputs.package }} ${{ matrix.config.args }}

      - name: Upload coverage to Codecov
        if: matrix.config.name == 'full' && env.HAS_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ inputs.package }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.config.name == 'full' && env.HAS_CODECOV == 'true' && hashFiles('target/nextest/default/junit.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: target/nextest/default/junit.xml
          report_type: test_results
          flags: ${{ inputs.package }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Sanity check benchmarks
        run: cargo bench ${{ matrix.config.args }} --package ${{ inputs.package }} --no-run
