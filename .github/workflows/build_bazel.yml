name: Build with Bazel

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true' || steps.filter.outputs.bazel == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/paths.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: fetch.recurseSubmodules
          GIT_CONFIG_VALUE_0: "false"
        with:
          filters: .github/paths.yml

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check cache write access
        id: cache_write
        uses: $/.github/actions/cache_write

      # LLVM alone unpacks to 11 GB on a Linux host.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Configure the remote cache
        uses: $/.github/actions/bazel_remote
        with:
          url: ${{ vars.CACHE_BZL_URL }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_BZL_AUTH || '' }}

      - name: Build every target
        run: just zbuild

      - name: Build every target with the release profile
        run: just zbuild -c opt

      - name: Build every target with the portable profiles
        run: |
          just zbuild --//bazel:portable
          just zbuild -c opt --//bazel:portable

      - name: Check the output root
        run: test -d .cache/bazel/install
