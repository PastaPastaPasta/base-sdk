name: Build on stable

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Check cache write access
        id: cache_write
        uses: $/.github/actions/cache_write

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix
        id: niks3
        uses: Mic92/niks3-action@v1
        if: vars.CACHE_NIX_URL != ''
        with:
          server-url: ${{ vars.CACHE_NIX_URL }}
          skip-push: ${{ steps.cache_write.outputs.allowed != 'true' }}

      - name: Upload devshell
        if: steps.cache_write.outputs.allowed == 'true' && vars.CACHE_NIX_URL != ''
        shell: bash
        env:
          NIKS3: ${{ steps.niks3.outputs.binary-dir }}/niks3
          NIKS3_SERVER_URL: ${{ vars.CACHE_NIX_URL }}
          NIKS3_TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          nix develop ./contrib/nix#ci --profile "${RUNNER_TEMP}/devshell" --command true
          "${NIKS3}" push --server-url "${NIKS3_SERVER_URL}" --auth-token-script "${NIKS3_TOKEN_SCRIPT}" \
            "$(readlink -f "${RUNNER_TEMP}/devshell")"

      - name: Verify the action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: just gha::setup gha::verify

      - name: Restore cargo registry
        uses: $/.github/actions/gha_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-
          restore-only: "true"
          url: ${{ vars.CACHE_GHA_URL }}
          bucket: ${{ vars.CACHE_GHA_BUCKET }}
          region: ${{ vars.CACHE_GHA_REGION }}
          key-id: ${{ vars.CACHE_GHA_KEY_ID }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_GHA_AUTH || '' }}

      - name: Manage build artifacts
        uses: $/.github/actions/gha_cache
        with:
          path: target
          key: cargo-build-lint-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cargo-build-lint-${{ runner.os }}-${{ runner.arch }}-
          url: ${{ vars.CACHE_GHA_URL }}
          bucket: ${{ vars.CACHE_GHA_BUCKET }}
          region: ${{ vars.CACHE_GHA_REGION }}
          key-id: ${{ vars.CACHE_GHA_KEY_ID }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_GHA_AUTH || '' }}

      - name: Manage CodeQL packs
        uses: $/.github/actions/gha_cache
        with:
          path: ~/.codeql
          key: codeql-packs-${{ hashFiles('maint/codeql/*/codeql-pack.lock.yml') }}
          url: ${{ vars.CACHE_GHA_URL }}
          bucket: ${{ vars.CACHE_GHA_BUCKET }}
          region: ${{ vars.CACHE_GHA_REGION }}
          key-id: ${{ vars.CACHE_GHA_KEY_ID }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_GHA_AUTH || '' }}

      - name: Configure the remote cache
        uses: $/.github/actions/bazel_remote
        with:
          url: ${{ vars.CACHE_BZL_URL }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_BZL_AUTH || '' }}

      - name: Run linters
        run: just lint

      - name: Lint every feature combination
        run: cargo hack --workspace --exclude-features default --feature-powerset clippy --all-targets -- -D warnings

      - name: Check PR title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 maint/lint/lint_commit.py -m "${PR_TITLE}"

      - name: Check PR commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: >
          python3 maint/lint/lint_commit.py
          -r "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  stable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64

    name: ${{ matrix.os }} (stable)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check cache write access
        id: cache_write
        uses: $/.github/actions/cache_write

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Manage cargo registry
        uses: $/.github/actions/gha_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-
          restore-only: ${{ runner.os != 'Linux' }}
          url: ${{ vars.CACHE_GHA_URL }}
          bucket: ${{ vars.CACHE_GHA_BUCKET }}
          region: ${{ vars.CACHE_GHA_REGION }}
          key-id: ${{ vars.CACHE_GHA_KEY_ID }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_GHA_AUTH || '' }}

      - name: Manage build artifacts
        uses: $/.github/actions/gha_cache
        with:
          path: target
          key: cargo-build-stable-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cargo-build-stable-${{ runner.os }}-${{ runner.arch }}-
          url: ${{ vars.CACHE_GHA_URL }}
          bucket: ${{ vars.CACHE_GHA_BUCKET }}
          region: ${{ vars.CACHE_GHA_REGION }}
          key-id: ${{ vars.CACHE_GHA_KEY_ID }}
          auth: ${{ steps.cache_write.outputs.allowed == 'true' && secrets.CACHE_GHA_AUTH || '' }}

      - name: Build every feature
        run: cargo hack --workspace --exclude-features default --each-feature build
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Test every feature
        run: cargo hack --workspace --exclude-features default --each-feature test
        env:
          RUSTUP_TOOLCHAIN: stable
