name: Build on stable

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://dashpay-base-sdk.cachix.org
            extra-trusted-public-keys = dashpay-base-sdk.cachix.org-1:TAoDyYL2e60lUEG8n10gvIZmujM5rJAhaG613fNfOWI=

      - name: Cache Nix
        uses: cachix/cachix-action@v17
        with:
          name: dashpay-base-sdk
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipAddingSubstituter: true

      - name: Restore cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-build-lint-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cargo-build-lint-${{ runner.os }}-${{ runner.arch }}-

      - name: Manage CodeQL packs
        uses: actions/cache@v5
        with:
          path: ~/.codeql
          key: codeql-packs-${{ hashFiles('maint/codeql/*/codeql-pack.lock.yml') }}

      - name: Run linters
        run: just lint

      - name: Lint every feature combination
        run: cargo hack --workspace --exclude-features default --feature-powerset clippy --all-targets -- -D warnings

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 maint/lint/lint_commit.py -m "${PR_TITLE}"

      - name: Check PR commit messages
        if: github.event_name == 'pull_request'
        run: >
          python3 maint/lint/lint_commit.py
          -r "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  stable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64

    name: ${{ matrix.os }} (stable)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Manage cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-build-stable-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cargo-build-stable-${{ runner.os }}-${{ runner.arch }}-

      - name: Build every feature
        run: cargo hack --workspace --exclude-features default --each-feature build
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Test every feature
        run: cargo hack --workspace --exclude-features default --each-feature test
        env:
          RUSTUP_TOOLCHAIN: stable
