name: Tag PRs

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [synchronize, opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  tag:
    name: Tag pull requests
    runs-on: ubuntu-slim
    # Each run rescans every pull request, so a newer run supersedes an older one.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag conflicting, outdated and stale PRs
        uses: actions/github-script@v9
        with:
          script: |
            const { tag } = require("./.github/scripts/pr_tag.js");
            await tag({ github, context });

      - name: Sync labels with the project board
        uses: actions/github-script@v9
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const script = require("./.github/scripts/pr_board.js");
            await script({ github, context, core });

  halt:
    name: Cancel the pull request's runs
    # The halt job stays out of the tag job's concurrency group, so a newer tag run cannot cancel it.
    if: github.event.action == 'labeled' && github.event.label.name == 'tag:halt-ci'
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cancel unfinished runs
        uses: actions/github-script@v9
        with:
          script: |
            const { halt } = require("./.github/scripts/pr_tag.js");
            await halt({ github, context, core });
