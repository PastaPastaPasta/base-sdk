name: Tag PRs

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [synchronize, opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tag:
    name: Tag pull requests
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag conflicting, outdated and stale PRs
        uses: actions/github-script@v8
        with:
          script: |
            const script = require("./.github/scripts/pr_tag.js");
            await script({ github, context });

      - name: Sync labels with the project board
        uses: actions/github-script@v8
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const script = require("./.github/scripts/pr_board.js");
            await script({ github, context, core });
