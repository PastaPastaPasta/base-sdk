name: "dash-pow"

on:
  workflow_dispatch:
  push:
    paths: &paths
      - pkgs/pow/**
      - pkgs/num/**
      - fuzz/**
      - Cargo.lock
      - Cargo.toml
      - .cargo/config.toml
      - .gitmodules
      - Justfile
      - .github/workflows/pkg_pow.yml
      - .github/workflows/build_stable.yml
      - contrib/nix/**
      - pyproject.toml
      - rust-toolchain.toml
      - uv.lock
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    uses: ./.github/workflows/build_stable.yml
    with:
      package: dash-pow
      package_dir: pow

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    name: ${{ matrix.os }} (fuzz corpora)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Manage cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: cargo-deps-fuzz-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: fuzz/target
          key: cargo-build-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cargo-build-fuzz-${{ runner.os }}-${{ runner.arch }}-

      - name: Replay fuzz corpora
        run: just fuzz::test
        env:
          RUSTUP_TOOLCHAIN: stable
