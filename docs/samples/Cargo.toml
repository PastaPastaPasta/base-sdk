[workspace]
members = ["parser", "solver"]
resolver = "3"

[workspace.dependencies]
bitcoin-consensus-encoding = { version = "1.3.0", default-features = false }
bitcoin-primitives = { version = "0.104.0", default-features = false }
bitcoin-units = { version = "0.7.0", default-features = false }

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
keyword_idents = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[profile.release]
lto = true
opt-level = "s"
