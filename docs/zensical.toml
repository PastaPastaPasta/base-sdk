[build_docs]
ignore_file = ".zenignore"
samples_dir = "samples"

[project]
site_name = "Base SDK for Dash"
site_description = "Documentation for the Base SDK for Dash."
site_author = "The Dash Core developers"
copyright = "Copyright &copy; 2026-present, The Dash Core developers"
docs_dir = "."
site_dir = ".site"
use_directory_urls = true
repo_url = "https://github.com/dashpay/base-sdk"
repo_name = "dashpay/base-sdk"
edit_uri = "edit/develop/docs"
extra_css = ["style.css"]
nav = [
  { "Home" = "README.md" },
  { "Contributing" = [
    { "Getting Started" = "dev/getting_started.md" },
    { "Cross Compilation" = "dev/cross_compilation.md" },
    { "Development Shells" = "dev/devshells.md" },
    { "Documentation" = "dev/about_docs.md" },
    { "Maintenance" = "dev/maintenance.md" },
    { "Style Guide (Rust)" = "dev/guide_rust.md" },
  ] },
  { "dash-types" = [
    { "Overview" = "types/README.md" },
    { "Changelog" = "types/changelog.md" },
  ] },
  { "dash-num" = [
    { "Overview" = "num/README.md" },
    { "Changelog" = "num/changelog.md" },
  ] },
  { "dash-pkc" = [
    { "Overview" = "pkc/README.md" },
    { "Changelog" = "pkc/changelog.md" },
  ] },
  { "dash-pow" = [
    { "Overview" = "pow/README.md" },
    { "Changelog" = "pow/changelog.md" },
  ] },
  { "Samples" = [
    { "Genesis Solver" = "samples/solver/README.md" },
    { "Object Parser" = "samples/parser/README.md" },
  ] },
]

[project.theme]
language = "en"
logo = "logo.svg"
favicon = "logo.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.expand",
  "navigation.footer",
  "navigation.instant.prefetch",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.preprocess]
repo_url = "https://github.com/dashpay/base-sdk"
branch = "develop"
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_style = "github-light-default"
pygments_lang_class = true
use_pygments = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
