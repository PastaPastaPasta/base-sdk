[package]
name = "dash-pow"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
std = ["wide/std"]
full = ["std", "simd"]
portable = []
simd = []

[dependencies]
wide = { workspace = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = { workspace = true }
hex-conservative = { workspace = true }
rstest = { workspace = true }

[[test]]
name = "echo"
[[test]]
name = "simd_hash"
[[bench]]
name = "pow"
path = "bench/main.rs"
harness = false
required-features = ["simd"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["portable"]
