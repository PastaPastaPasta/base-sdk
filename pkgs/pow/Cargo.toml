[package]
name = "dash-pow"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
std = []
full = ["std", "aes_hw", "simd"]
aes_hw = ["simd"]
portable = []
simd = []

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = { workspace = true }
hex-conservative = { workspace = true }
rstest = { workspace = true }

[[test]]
name = "blake"
[[test]]
name = "bmw"
[[test]]
name = "cubehash"
[[test]]
name = "echo"
[[test]]
name = "groestl"
[[test]]
name = "jh"
[[test]]
name = "keccak"
[[test]]
name = "luffa"
[[test]]
name = "shavite"
[[test]]
name = "simd_hash"
[[test]]
name = "skein"
[[bench]]
name = "pow"
path = "bench/main.rs"
harness = false
required-features = ["simd"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["portable"]
