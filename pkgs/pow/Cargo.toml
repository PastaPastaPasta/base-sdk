[package]
name = "dash-pow"
version = "0.1.0-beta"
description = "Proof of Work hash primitive for the Dash Base SDK"
keywords = ["base-sdk", "dash", "dashcore", "dashpay", "x11"]
categories = [
  "cryptography",
  "cryptography::cryptocurrencies",
  "no-std",
  "wasm",
]
exclude = [
  "bench",
  "corpus",
  "tests",
]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = ["portable"]
std = [
  "wide/std",
]

full = [
  "std",
]
portable = []

[dependencies]
digest = { workspace = true }
wide = { workspace = true }

[dev-dependencies]
dash-dev = { path = "../../meta/dev", features = ["full"] }
divan = { workspace = true }
hex-conservative = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "pow"
path = "bench/main.rs"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["portable"]
