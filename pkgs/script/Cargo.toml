[package]
name = "dash-script"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = ["codec"]
std = [
  "base58ck?/std",
  "bitcoin-consensus-encoding?/std",
  "dash-num?/std",
  "dash-params?/std",
  "dash-pkc?/std",
  "dash-types/std",
]
codec = [
  "dash-num/codec",
  "dash-params/codec",
  "dash-pkc/codec",
  "dash-types/bitcoin-primitives",
  "dash-types/codec",
  "dep:base58ck",
  "dep:bitcoin-consensus-encoding",
  "dep:dash-num",
  "dep:dash-params",
  "dep:dash-pkc",
]
full = [
  "codec",
  "serde",
  "std",
]
portable = ["dash-params?/portable", "dash-pkc?/portable"]
serde = [
  "dash-pkc?/serde",
  "dash-types/serde",
  "dep:serde",
]

[dependencies]
base58ck = { workspace = true, optional = true, features = ["alloc"] }
bitcoin-consensus-encoding = { workspace = true, optional = true, features = [
  "alloc",
] }
dash-num = { version = "0.2.0-beta", path = "../num", optional = true, default-features = false }
dash-params = { version = "0.0.0", path = "../params", optional = true, default-features = false }
dash-pkc = { version = "0.2.0-beta", path = "../pkc", optional = true, default-features = false }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false }
serde = { workspace = true, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
hex-conservative = { workspace = true, features = ["std"] }
rstest = { workspace = true }

[lints]
workspace = true
