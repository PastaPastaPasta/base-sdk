[package]
name = "dash-script"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
std = [
  "base58ck/std",
  "bitcoin-consensus-encoding/std",
  "dash-pkc/std",
  "dash-types/std",
]
full = ["std", "serde"]
portable = ["dash-pkc/portable"]
serde = ["dep:serde", "dash-pkc/serde", "dash-types/serde"]

[dependencies]
base58ck = { workspace = true, features = ["alloc"] }
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
dash-num = { version = "0.1.0-beta", path = "../num", default-features = false }
dash-pkc = { version = "0.1.0-beta", path = "../pkc", default-features = false, features = [
  "codec",
] }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false, features = [
  "bitcoin-primitives",
  "codec",
] }
serde = { workspace = true, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
hex-conservative = { workspace = true, features = ["std"] }
rstest = { workspace = true }

[lints]
workspace = true
