[package]
name = "dash-p2p-core"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
std = [
  "dash-params/std",
  "dash-pkc/std",
  "dash-primitives/std",
  "dash-script/std",
  "dash-types/std",
]
serde = [
  "dep:serde",
  "dash-num/serde",
  "dash-pkc/serde",
  "dash-primitives/serde",
  "dash-script/serde",
  "dash-types/serde",
]
full = ["std", "serde"]
portable = [
  "dash-params/portable",
  "dash-pkc/portable",
  "dash-primitives/portable",
  "dash-script/portable",
]

[dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
cfg-if = "1"
dash-num = { version = "0.2.0-beta", path = "../num", default-features = false, features = [
  "codec",
] }
dash-pkc = { version = "0.2.0-beta", path = "../pkc", default-features = false, features = [
  "codec",
] }
dash-script = { version = "0.0.0", path = "../script", default-features = false, features = [
  "codec",
] }
dash-params = { version = "0.0.0", path = "../params", default-features = false, features = [
  "codec",
] }
dash-primitives = { version = "0.0.0", path = "../primitives", default-features = false }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false, features = [
  "codec",
] }
getset = { workspace = true }
serde = { workspace = true, features = [
  "alloc",
  "derive",
], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../../meta/dev", features = ["full"] }
hex-conservative = { workspace = true, features = ["std"] }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["portable"]
