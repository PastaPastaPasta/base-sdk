[package]
name = "dash-params"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
std = [
  "bitcoin_hashes/std",
  "bitcoin-units/std",
  "dash-num/std",
  "dash-types/std",
]
full = ["std"]

[dependencies]
bitcoin_hashes = { workspace = true, features = ["alloc"] }
bitcoin-units = { workspace = true, features = ["alloc"] }
dash-num = { version = "0.2.0-beta", path = "../num", features = ["codec"] }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false, features = [
  "codec",
] }
hex-conservative = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
