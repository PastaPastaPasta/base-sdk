[package]
name = "dash-params"
version = "0.0.0"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
std = ["bitcoin-primitives/std", "dash-primitives/std", "dash-script/std"]
full = ["std"]
portable = ["dash-primitives/portable", "dash-script/portable"]

[dependencies]
bitcoin-primitives = { workspace = true, features = ["alloc"] }
bitcoin-units = { workspace = true, features = ["alloc"] }
dash-num = { version = "0.2.0-beta", path = "../num", features = ["codec"] }
dash-primitives = { version = "0.0.0", path = "../primitives" }
dash-script = { version = "0.0.0", path = "../script" }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false, features = [
  "codec",
] }
hex-conservative = { workspace = true }

[dev-dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
dash-dev = { version = "0.0.0", path = "../../meta/dev", features = ["full"] }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["portable"]
