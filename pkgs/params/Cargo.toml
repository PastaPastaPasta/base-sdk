[package]
name = "dash-params"
version = "0.0.0"
exclude = [
  "contrib",
]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = ["codec"]
std = [
  "bitcoin_hashes/std",
  "bitcoin-units/std",
  "dash-num/std",
  "dash-types/std",
]
codec = [
  "dash-num/codec",
  "dash-types/codec",
]
full = [
  "codec",
  "std",
]

[dependencies]
bitcoin_hashes = { workspace = true, features = ["alloc"] }
bitcoin-units = { workspace = true, features = ["alloc"] }
dash-num = { version = "0.2.0-beta", path = "../num", default-features = false }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false }
hex-conservative = { workspace = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../../meta/dev", features = ["full"] }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
