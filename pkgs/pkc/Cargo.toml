[package]
name = "dash-pkc"
version = "0.2.0-beta"
description = "Cryptographic primitives for the Dash Base SDK"
keywords = ["base-sdk", "dash", "dashcore", "dashpay"]
categories = [
  "cryptography",
  "cryptography::cryptocurrencies",
  "no-std",
  "wasm",
]
exclude = [
  "bench",
  "contrib",
  "corpus",
  "tests",
]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[dependencies]
aes = { version = "0.9", default-features = false, features = [
  "zeroize",
], optional = true }
base58ck = { workspace = true, optional = true, features = ["alloc"] }
bitcoin_hashes = { workspace = true, features = ["alloc"] }
blst = { version = "0.3", default-features = false, optional = true }
cfg-if = "1"
dash-num = { version = "0.2.0-beta", path = "../num", default-features = false }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = [
  "fast",
  "rand_core",
  "signature",
  "zeroize",
], optional = true }
ff = { version = "0.14", default-features = false, optional = true }
group = { version = "0.14", default-features = false, optional = true }
hex-conservative = { workspace = true, features = [
  "alloc",
] }
rand_core = { workspace = true, optional = true }
secp256k1 = { version = "0.33.1", default-features = false, features = [
  "alloc",
  "recovery",
], optional = true }
serde = { workspace = true, features = [
  "alloc",
  "derive",
], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
dash-dev = { path = "../../meta/dev", features = ["full"] }
divan = { workspace = true }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex-conservative = { workspace = true, features = ["std"] }
rand_core = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

[features]
default = ["codec"]
std = [
  "base58ck?/std",
  "bitcoin_hashes/std",
  "dash-types/std",
]

bls = [
  "dep:aes",
  "dep:blst",
  "dep:ff",
  "dep:group",
  "dep:rand_core",
  "dep:sha2",
]
codec = [
  "dash-num/codec",
  "dash-types/codec",
  "dep:base58ck",
]
ecdsa = [
  "dep:rand_core",
  "dep:secp256k1",
]
eddsa = [
  "dep:ed25519-dalek",
  "dep:rand_core",
]
full = [
  "bls",
  "codec",
  "ecdsa",
  "eddsa",
  "serde",
  "std",
]
portable = ["blst?/portable"]
serde = [
  "dash-num/serde",
  "dash-types/serde",
  "dep:serde",
]

[lints]
workspace = true

[[bench]]
name = "pkc"
path = "bench/main.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
