[package]
name = "dash-num"
version = "0.1.0-beta"
description = "Wide-integer blob and arithmetic types for the Dash Base SDK"
keywords = ["base-sdk", "dash", "dashcore", "dashpay"]
categories = [
  "cryptography::cryptocurrencies",
  "encoding",
  "no-std",
  "wasm",
]
exclude = [
  "bench",
  "corpus",
  "tests",
]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["codec"]
std = [
  "bitcoin-consensus-encoding?/std",
  "bitcoin-internals/std",
  "dash-types/std",
  "hex-conservative/std",
]

codec = [
  "dash-types/codec",
  "dep:bitcoin-consensus-encoding",
]
full = [
  "codec",
  "serde",
  "std",
]
serde = [
  "dash-types/serde",
  "dep:serde",
]

[dependencies]
ambassador = { workspace = true }
bitcoin-consensus-encoding = { workspace = true, optional = true }
bitcoin-internals = { workspace = true }
dash-types = { version = "0.1.0-beta", path = "../types", default-features = false }
delegate = { workspace = true }
hex-conservative = { workspace = true }
serde = { workspace = true, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
dash-dev = { path = "../dev", features = ["full"] }
divan = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

[[test]]
name = "hash"
path = "tests/hash.rs"

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]

[[bench]]
name = "num"
path = "bench/main.rs"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
