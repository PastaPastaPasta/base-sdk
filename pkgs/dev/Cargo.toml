[package]
name = "dash-dev"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[[bin]]
name = "bsdk-util"
path = "src/bin/bsdk_util/main.rs"
bench = false
required-features = ["bin"]

[features]
default = []
std = [
  "dep:json5",
  "dep:serde_json",
  "bitcoin-consensus-encoding/std",
  "ciborium?/std",
  "dash-primitives/std",
  "dash-types/std",
  "hex-conservative/std",
]
full = ["std", "serde"]
serde = [
  "dep:ciborium",
  "dep:serde",
  "dash-primitives/serde",
  "dash-types/serde",
]
bin = [
  "full",
  "dep:chrono",
  "dep:clap",
  "dep:dash-num",
  "dep:dash-params",
  "dep:dash-pow",
  "dep:indicatif",
  "dep:rayon",
  "dep:sysinfo",
]

[build-dependencies]
built = { version = "0.7", features = ["dependency-tree", "git2"] }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false, features = [
  "codec",
] }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
cfg-if = "1"
dash-num = { version = "0.2.0-beta", path = "../num", optional = true, features = [
  "codec",
] }
dash-params = { version = "0.0.0", path = "../params", optional = true }
dash-pow = { version = "0.0.0", path = "../pow", optional = true }
dash-primitives = { version = "0.0.0", path = "../primitives" }
dash-types = { version = "0.2.0-beta", path = "../types", default-features = false, features = [
  "codec",
] }
hex-conservative = { workspace = true, features = [
  "alloc",
] }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
], optional = true }
ciborium = { version = "0.2", optional = true }
clap = { version = "4", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
], optional = true }
indicatif = { version = "0.18", default-features = false, optional = true }
json5 = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }
serde = { workspace = true, features = [
  "derive",
  "alloc",
], optional = true }
serde_json = { version = "1", optional = true }
sysinfo = { version = "0.33", default-features = false, features = [
  "system",
], optional = true }

[lints]
workspace = true
