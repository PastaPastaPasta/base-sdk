[package]
name = "dash-types"
version = "0.2.0-beta"
description = "Fixed-width and buffered type (de)serialization for the Dash Base SDK"
keywords = ["base-sdk", "dash", "dashcore", "dashpay"]
categories = [
  "cryptography::cryptocurrencies",
  "encoding",
  "no-std",
  "wasm",
]
exclude = [
  "bench",
  "corpus",
  "tests",
]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = ["codec"]
std = [
  "bitcoin-consensus-encoding?/std",
  "bitcoin-primitives?/std",
  "hex-conservative/std",
]

bitcoin-primitives = [
  "codec",
  "dep:base58ck",
  "dep:bitcoin_hashes",
  "dep:bitcoin-primitives",
]
codec = [
  "dep:bitcoin-consensus-encoding",
  "dep:dash-types-marker",
]
full = [
  "bitcoin-primitives",
  "codec",
  "serde",
  "std",
]
serde = [
  "dep:serde",
  "hex-conservative/alloc",
]

[dependencies]
base58ck = { workspace = true, optional = true, features = ["alloc"] }
bitcoin-consensus-encoding = { workspace = true, optional = true }
bitcoin_hashes = { workspace = true, optional = true, features = ["alloc"] }
bitcoin-primitives = { workspace = true, optional = true, features = ["alloc"] }
cfg-if = "1"
dash-types-marker = { version = "0.1.0-beta", path = "marker", default-features = false, optional = true }
hex-conservative = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = [
  "derive",
  "alloc",
], optional = true }
zeroize = { workspace = true }

[dev-dependencies]
ciborium = "0.2"
rstest = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
